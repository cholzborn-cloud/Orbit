[project]
name = "orbitd"
version = "2.0.0"
description = "Orbit Hintergrunddienst (Python)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "starlette",
  "uvicorn",
  "httpx",
  "mcp>=2,<3",
]

[dependency-groups]
dev = ["pytest", "anyio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

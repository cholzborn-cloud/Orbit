<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{{title}} · Orbit</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #1c1c1c;
      --muted: #6b6b6b;
      --orbi: #43a191;
      --eyes: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #121212;
        --text: #eeeeee;
        --muted: #a0a0a0;
        --orbi: #55b5a4;
        --eyes: #0f172a;
      }
    }
    body {
      display: grid;
      min-height: 100svh;
      margin: 0;
      place-items: center;
      background: var(--background);
      color: var(--text);
    }
    main {
      box-sizing: border-box;
      width: min(100%, 30rem);
      padding: 2rem 1.5rem;
      text-align: center;
    }
    .orbi {
      display: flex;
      height: 4.5rem;
      margin: 0 auto .5rem;
      align-items: center;
      justify-content: center;
      gap: .625rem;
    }
    .orbi svg { display: block; width: 1.875rem; height: auto; }
    .orbi svg:nth-child(1) { width: 1.625rem; transform: translateY(.8rem); }
    .orbi svg:nth-child(2) { transform: translateY(-.625rem); }
    .orbi svg:nth-child(3) { width: 3.75rem; }
    .orbi svg:nth-child(4) { width: 2rem; transform: translateY(-.375rem); }
    .orbi svg:nth-child(5) { width: 1.625rem; transform: translateY(.875rem); }
    .orbi [fill="#43a191"] { fill: var(--orbi); }
    .orbi [fill="#ffffff"] { fill: var(--eyes); }
    @media (prefers-color-scheme: dark) {
      .orbi [fill="#906538"] { fill: #996e42; }
      .orbi [fill="#8152eb"] { fill: #895df3; }
      .orbi [fill="#cf811e"] { fill: #e9993a; }
      .orbi [fill="#bf3bdb"] { fill: #c849e4; }
    }
    h1 {
      margin: 0;
      font-size: 1.875rem;
      line-height: 1.2;
      letter-spacing: -.025em;
      font-weight: 600;
      text-wrap: balance;
    }
    p {
      max-width: 32ch;
      margin: .5rem auto 0;
      color: var(--muted);
      font-size: .875rem;
      line-height: 1.5;
      text-wrap: pretty;
    }
  </style>
</head>
<body>
  <main>
    <span class="orbi" aria-hidden="true">{{orbi}}</span>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
  </main>
</body>
</html>
